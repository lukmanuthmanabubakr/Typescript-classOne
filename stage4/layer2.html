<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Async JS – Callbacks</title>
  </head>

  <body class="bg-black text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md space-y-6 text-center">
      <h1 class="text-2xl font-bold">Async JavaScript – Callbacks</h1>

      <p id="status" class="text-yellow-400">Idle</p>

      <ul
        id="dataList"
        class="min-h-[60px] border border-gray-600 rounded p-4 text-sm"
      ></ul>

      <div class="flex gap-4 justify-center">
        <button
          id="loadSuccess"
          class="px-4 py-2 bg-green-600 rounded hover:bg-green-700"
        >
          Load Success
        </button>

        <button
          id="loadError"
          class="px-4 py-2 bg-red-600 rounded hover:bg-red-700"
        >
          Load Error
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
